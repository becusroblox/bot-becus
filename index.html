<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becus War Bot Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Làm lớp phủ tối mỏng đi để nhìn rõ ảnh nền laudainhavua.jpg */
            background: linear-gradient(rgba(8, 9, 12, 0.35), rgba(8, 9, 12, 0.55)), url('laudainhavua.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 35px;
            z-index: 2;
        }
        .war-status {
            display: inline-block;
            background: rgba(40, 42, 48, 0.7);
            border: 1px solid rgba(120, 125, 135, 0.4);
            color: #b0b5bc;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .brand-tag {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .bot-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            max-width: 1000px;
            width: 100%;
            z-index: 2;
        }
        .bot-card {
            /* Card siêu trong suốt để nhìn xuyên thấu ảnh nền, viền trắng sáng */
            background: rgba(15, 17, 22, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .bot-card:hover {
            transform: translateY(-6px);
            background: rgba(15, 17, 22, 0.35);
            border-color: #ffffff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .bot-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin: 0 auto 18px auto;
            border: 2px solid #ff0000;
            background-color: #0b0c10;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .bot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bot-card h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }
        .bot-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            font-family: monospace;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @keyframes energyFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn {
            display: inline-block;
            /* Trả lại màu hiệu ứng chạy đỏ rực */
            background: linear-gradient(270deg, #ff0000, #990000, #ff3333, #660000);
            background-size: 300% 300%;
            animation: energyFlow 4s ease infinite;
            color: white;
            padding: 11px 0;
            width: 100%;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
