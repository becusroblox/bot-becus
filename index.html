<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becus War Bot Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(8, 9, 12, 0.6), rgba(8, 9, 12, 0.75)), url('laudainhavua.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #dbdee1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 2;
        }
        .war-status {
            background: rgba(40, 42, 48, 0.6);
            border: 1px solid rgba(120, 125, 135, 0.4);
            color: #b0b5bc;
            font-size: 0.8rem;
            font-family: monospace;
            padding: 6px 16px;
            border-radius: 4px;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }
        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
        .brand-tag {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .bot-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
            z-index: 2;
        }
        .bot-card {
            /* Card siêu trong suốt nhìn xuyên thấu ảnh nền, viền trắng */
            background-color: rgba(15, 17, 22, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 25px 20px;
            border-radius: 12px;
            width: 280px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .bot-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(255, 255, 255, 0.2);
            background-color: rgba(15, 17, 22, 0.3);
            border-color: #ffffff;
        }
        .bot-avatar {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 2px solid #ff0000;
            background-color: #08090c;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .bot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .bot-card h2 {
            font-size: 1.3rem;
            margin: 0 0 8px 0;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }
        .bot-card p {
            font-size: 0.85rem;
            color: #d0d5dc;
            min-height: 25px;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @keyframes energyFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn {
            display: inline-block;
            background: linear-gradient(270deg, #ff0000, #990000, #ff3333, #660000);
            background-size: 300% 300%;
            animation: energyFlow 4s ease infinite;
            color: white;
            padding: 10px 0;
            width: 100%;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
