<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mời Bot Discord</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 30px;
        }
        .bot-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
        }
        .bot-card {
            background-color: #2b2d31;
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .bot-card h2 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-top: 0;
        }
        .bot-card p {
            font-size: 0.9rem;
            color: #949ba4;
            min-height: 40px;
        }
        .btn {
            display: inline-block;
            background-color: #5865F2;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>

    <h1>Danh Sách Bot Discord</h1>

    <div class="bot-container">
        <!-- Bot 1 -->
        <div class="bot-card">
            <h2>Bot 1</h2>
            <p>Mô tả ngắn gọn chức năng của bot 1.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1543488614770417795&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>

        <!-- Bot 2 -->
        <div class="bot-card">
            <h2>Bot 2</h2>
            <p>Mô tả ngắn gọn chức năng của bot 2.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1545149071784677376&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>

        <!-- Bot 3 -->
        <div class="bot-card">
            <h2>Bot 3</h2>
            <p>Mô tả ngắn gọn chức năng của bot 3.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1548293042660704337&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>
    </div>

</body>
  </html>
