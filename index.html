<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Dark & Gold - Discord Bot Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen relative overflow-x-hidden font-sans" style="background-image: url('laudainhavua.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">

    <!-- Lớp phủ tối màu mờ ảo cho nền sang trọng -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm pointer-events-none z-0"></div>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-8">
        
        <!-- HEADER -->
        <header class="text-center mb-8">
            <div class="inline-block px-6 py-2 rounded-full border border-amber-500/40 bg-black/40 backdrop-blur-md text-amber-400 text-xs sm:text-sm tracking-widest uppercase mb-4 shadow-lg">
                Lệnh War Cần Key Admin
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-600 drop-shadow-md mb-2">
                DANH SÁCH BOT DISCORD
            </h1>
            <p class="text-amber-200/70 text-sm sm:text-base tracking-wider uppercase">
                Càng nhiều bot càng mạnh
            </p>
        </header>

        <!-- KHUNG CHỨA DANH SÁCH BOT (VUỐT NGANG) -->
        <div class="w-full max-w-6xl">
            <div class="flex overflow-x-auto snap-x snap-mandatory space-x-6 px-4 py-6 scrollbar-none">
                
                <!-- BOT CARD 1 -->
                <div class="flex-shrink-0 w-80 sm:w-96 snap-center bg-neutral-950/30 backdrop-blur-xl border border-amber-500/40 rounded-3xl p-6 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] flex flex-col items-center relative group hover:border-amber-500/80 transition-all duration-300">
                    
                    <!-- Crown đứng yên phía trên card -->
                    <div class="absolute -top-7 z-30">
                        <img src="crown.png" alt="Crown" class="w-20 h-20 object-contain drop-shadow-[0_8px_8px_rgba(0,0,0,0.9)]">
                    </div>

                    <!-- Khung Avatar chuẩn kích thước -->
                    <div class="relative w-32 h-32 mt-6 mb-4 flex items-center justify-center">
                        <!-- Ảnh Avatar bên trong -->
                        <div class="w-24 h-24 rounded-full overflow-hidden relative z-10 flex items-center justify-center shadow-inner">
                            <img src="vuongmieng.png" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                        <!-- Khung vòng gai bọc ngoài (Đã scale vừa khít) -->
                        <img src="khungavt.png" alt="Frame" class="absolute inset-0 w-full h-full object-contain z-20 pointer-events-none scale-125">
                    </div>

                    <!-- Tên Bot & Thông tin -->
                    <h2 class="text-xl font-bold text-amber-300 tracking-wide mt-4">BOT WAR 1</h2>
                    <p class="text-neutral-400 text-xs sm:text-sm mt-1 mb-6 font-mono">/menu | bot by becus</p>

                    <!-- Nút Thêm Bot -->
                    <a href="#" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-neutral-950 font-bold tracking-wider text-center uppercase shadow-lg hover:brightness-110 active:scale-95 transition-all">
                        Thêm Bot
                    </a>
                </div>

                <!-- BOT CARD 2 -->
                <div class="flex-shrink-0 w-80 sm:w-96 snap-center bg-neutral-950/30 backdrop-blur-xl border border-amber-500/40 rounded-3xl p-6 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] flex flex-col items-center relative group hover:border-amber-500/80 transition-all duration-300">
                    <div class="absolute -top-7 z-30">
                        <img src="crown.png" alt="Crown" class="w-20 h-20 object-contain drop-shadow-[0_8px_8px_rgba(0,0,0,0.9)]">
                    </div>
                    <div class="relative w-32 h-32 mt-6 mb-4 flex items-center justify-center">
                        <div class="w-24 h-24 rounded-full overflow-hidden relative z-10 flex items-center justify-center shadow-inner">
                            <img src="vuongmieng.png" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                        <img src="khungavt.png" alt="Frame" class="absolute inset-0 w-full h-full object-contain z-20 pointer-events-none scale-125">
                    </div>
                    <h2 class="text-xl font-bold text-amber-300 tracking-wide mt-4">BOT WAR 2</h2>
                    <p class="text-neutral-400 text-xs sm:text-sm mt-1 mb-6 font-mono">/help | bot by becus</p>
                    <a href="#" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-neutral-950 font-bold tracking-wider text-center uppercase shadow-lg hover:brightness-110 active:scale-95 transition-all">
                        Thêm Bot
                    </a>
                </div>

                    <div class="absolute -top-7 z-30">
                        <img src="crown.png" alt="Crown" class="w-20 h-20 object-contain drop-shadow-[0_8px_8px_rgba(0,0,0,0.9)]">
                    </div>
                    <div class="relative w-32 h-32 mt-6 mb-4 flex items-center justify-center">
                        <div class="w-24 h-24 rounded-full overflow-hidden relative z-10 flex items-center justify-center shadow-inner">
                            <img src="vuongmieng.png" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                        <img src="khungavt.png" alt="Frame" class="absolute inset-0 w-full h-full object-contain z-20 pointer-events-none scale-125">
                    </div>
                    <h2 class="text-xl font-bold text-amber-300 tracking-wide mt-4">BOT WAR 3</h2>
                    <p class="text-neutral-400 text-xs sm:text-sm mt-1 mb-6 font-mono">/config | bot by becus</p>
                    <a href="#" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-neutral-950 font-bold tracking-wider text-center uppercase shadow-lg hover:brightness-110 active:scale-95 transition-all">
                        Thêm Bot
                    </a>
                </div>

            </div>
        </div>

    </div>

</body>
    </html>
