<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becus War Bot Hub - Tactical System</title>
    <style>
        * {
            box-sizing: border-box;
        }
        @keyframes scanlineMove {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 40px, 40px 40px; }
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #08090c;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 0, 0, 0.05));
            background-size: 100% 4px, 40px 40px;
            animation: scanlineMove 8s linear infinite;
            color: #dbdee1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .war-status {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.6);
            color: #ff3333;
            font-size: 0.8rem;
            font-family: monospace;
            padding: 6px 16px;
            border-radius: 4px;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: electricTextFlicker 1.5s infinite;
        }
        @keyframes electricTextFlicker {
            0%, 100% { text-shadow: 0 0 5px #ff0000; opacity: 0.9; }
            50% { text-shadow: 0 0 15px #ff3333, 0 0 25px #ffffff; opacity: 1; }
        }
        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
        .brand-tag {
            color: #ff3333;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }
        .bot-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
        }
        @keyframes electricFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                border-color: rgba(255, 0, 0, 0.35);
                box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 0, 0, 0.05);
            }
            20%, 24%, 55% {
                border-color: #ff3333;
                box-shadow: 0 0 35px #ff0000, 0 0 50px rgba(255, 0, 0, 0.8), inset 0 0 30px rgba(255, 0, 0, 0.4);
            }
        }
        .bot-card {
            background-color: #121419;
            border: 1px solid rgba(255, 0, 0, 0.35);
            padding: 25px 20px;
            border-radius: 12px;
            width: 280px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 0, 0, 0.05);
            animation: electricFlicker 3s infinite ease-in-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .bot-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 35px rgba(255, 0, 0, 0.45), inset 0 0 25px rgba(255, 0, 0, 0.15);
            border-color: #ff0000;
        }
        .bot-avatar {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 2px solid #ff0000;
            background-color: #08090c;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .bot-avatar::before {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border: 2px dashed rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            animation: radarSpin 5s linear infinite;
        }
        @keyframes radarSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .bot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background-color: #23a55a;
            border: 2px solid #121419;
            border-radius: 50%;
            box-shadow: 0 0 10px #23a55a;
            z-index: 2;
        }
        @keyframes redGlowPulse {
            0% {
                color: #ff0000;
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            }
            50% {
                color: #121212;
                text-shadow: 0 0 2px #000000;
            }
            100% {
                color: #ff0000;
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            }
        }
        @keyframes glitchText {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; }
            40% { transform: translate(1px, -1px); text-shadow: -2px 0 #00ffff, 2px 0 #ff00ff; }
            60% { transform: translate(0); text-shadow: 0 0 12px #ff0000; }
            100% { transform: translate(0); }
        }
        .bot-card h2 {
            font-size: 1.3rem;
            margin: 0 0 8px 0;
            animation: redGlowPulse 2s infinite ease-in-out, glitchText 4s infinite;
        }
        .bot-card p {
            font-size: 0.85rem;
            color: #b0b5bc;
            min-height: 25px;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 0.5px;
        }
        @keyframes energyFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn {
            display: inline-block;
            background: linear-gradient(270deg, #ff0000, #990000, #ff3333, #660000);
            background-size: 300% 300%;
            animation: energyFlow 4s ease infinite;
            color: white;
            padding: 10px 0;
            width: 100%;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <header>
        <div class="war-status">LỆNH WAR CẦN KEY ADMIN</div>
        <h1>Danh Sách Bot Discord</h1>
        <div class="brand-tag">CÀNG NHIỀU BOT CÀNG MẠNH</div>
    </header>

    <div class="bot-container">
        <!-- Bot 1 -->
        <div class="bot-card">
            <div class="bot-avatar">
                <img src="becus.png" alt="Becus Logo">
                <span class="online-dot"></span>
            </div>
            <h2>BOT WAR 1</h2>
            <p>/menu | xem lệnh bot.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1543488614770417795&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>

        <!-- Bot 2 -->
        <div class="bot-card">
            <div class="bot-avatar">
                <img src="becus.png" alt="Becus Logo">
                <span class="online-dot"></span>
            </div>
            <h2>BOT WAR 2</h2>
            <p>/menu | xem lệnh bot.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1545149071784677376&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>

        <!-- Bot 3 -->
        <div class="bot-card">
            <div class="bot-avatar">
                <img src="becus.png" alt="Becus Logo">
                <span class="online-dot"></span>
            </div>
            <h2>BOT WAR 3</h2>
            <p>/menu | xem lệnh bot.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1548293042660704337&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>
    </div>

</body>
</html>
