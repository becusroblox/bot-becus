<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becus War Bot Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0e12;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 0, 0, 0.04));
            background-size: 100% 4px, 40px 40px;
            color: #dbdee1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .brand-tag {
            color: #ff3333;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        .bot-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }
        .bot-card {
            background-color: #16181d;
            border: 1px solid rgba(255, 0, 0, 0.25);
            padding: 25px 20px;
            border-radius: 12px;
            width: 280px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .bot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.35), inset 0 0 20px rgba(255, 0, 0, 0.15);
            border-color: #ff0000;
        }
        .bot-avatar {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 2px solid #ff0000;
            background-color: #0d0e12;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
        }
        .bot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background-color: #23a55a;
            border: 2px solid #16181d;
            border-radius: 50%;
            box-shadow: 0 0 8px #23a55a;
        }
        @keyframes redGlowPulse {
            0% {
                color: #ff0000;
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            }
            50% {
                color: #550000;
                text-shadow: 0 0 2px #330000;
            }
            100% {
                color: #ff0000;
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            }
        }
        .bot-card h2 {
            font-size: 1.3rem;
            margin: 0 0 8px 0;
            animation: redGlowPulse 2s infinite ease-in-out;
        }
        .bot-card p {
            font-size: 0.85rem;
            color: #b0b5bc;
            min-height: 25px;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 0.5px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #b30000 0%, #660000 100%);
            color: white;
            padding: 10px 0;
            width: 100%;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #ff3333;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
        .btn:active {
            transform: scale(0.97);
        }
        footer {
            margin-top: auto;
            font-size: 0.8rem;
            color: #6d6f78;
            padding-top: 30px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Danh Sách Bot Discord</h1>
        <div class="brand-tag">CÀNG NHIỀU BOT CÀNG MẠNH</div>
    </header>

    <div class="bot-container">
        <!-- Bot 1 -->
        <div class="bot-card">
            <div class="bot-avatar">
                <img src="becus.png" alt="Becus Logo">
                <span class="online-dot"></span>
            </div>
            <h2>BOT WAR 1</h2>
            <p>/menu | becus!xangon.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1543488614770417795&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>

        <!-- Bot 2 -->
        <div class="bot-card">
            <div class="bot-avatar">
                <img src="becus.png" alt="Becus Logo">
                <span class="online-dot"></span>
            </div>
            <h2>BOT WAR 2</h2>
            <p>/menu | becus!xangon.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1545149071784677376&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>

        <!-- Bot 3 -->
        <div class="bot-card">
            <div class="bot-avatar">
                <img src="becus.png" alt="Becus Logo">
                <span class="online-dot"></span>
            </div>
            <h2>BOT WAR 3</h2>
            <p>/menu | becus!xangon.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1548293042660704337&permissions=8&integration_type=0&scope=bot" class="btn" target="_blank">Thêm Bot</a>
        </div>
    </div>

    <footer>
        &copy; 2026 BECUS . LỆNH WAR CẦN KEY ADMIN.
    </footer>

</body>
</html>
