    <!-- Import Google Fonts hoàng gia -->

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, rgba(8, 8, 12, 0.8), rgba(18, 15, 8, 0.9)), url('laudainhavua.jpg');

            background-position: center;
            background-attachment: fixed;

        .royal-title {
            font-family: 'Cinzel', serif;
        }

            background: linear-gradient(135deg, #fce99f 0%, #d4af37 50%, #996515 100%);
        }
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .gold-glow:hover {
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.9);
        }
        .royal-line {
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.8), transparent);
            height: 1px;
        }
        /* Hiệu ứng xoay tròn vòng vương miện */
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 10s linear infinite;
        }
    </style>
